name: Repository quality

on:
  push:
    branches:
      - "claude/church-website-app-HNkR5"
      - "agent/full-repository-hardening"
  pull_request:
    branches:
      - "claude/church-website-app-HNkR5"

permissions:
  contents: write

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply idempotent client hardening
        run: npm run patch:client

      - name: Commit generated client changes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo "No generated client changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "fix: apply client hardening [generated]"
          git push

      - name: Install Functions dependencies
        run: npm --prefix functions install --ignore-scripts

      - name: Validate repository
        run: npm run check
