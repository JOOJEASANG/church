name: Firebase Deploy

on:
  push:
    branches:
      - main
      - claude/church-website-app-HNkR5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase (Hosting + Database + Storage rules)
        run: firebase deploy --only hosting,database,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
