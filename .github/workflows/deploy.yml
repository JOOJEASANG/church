name: Firebase Deploy

on:
  push:
    branches:
      - main
      - claude/church-website-app-HNkR5
      - claude/full-file-review-BCCnR

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm install --prefix functions

      - name: Deploy to Firebase (Hosting + Database + Storage + Functions)
        run: firebase deploy --only hosting,database,storage,functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
