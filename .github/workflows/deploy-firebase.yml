name: Deploy Firebase production

on:
  push:
    branches:
      - "claude/church-website-app-HNkR5"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHURCH_399CB }}
      FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'firebase/deploy',
              description: 'Firebase production deployment is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Bible data migration
        run: node scripts/remove-legacy-daily-verses.mjs

      - name: Install Functions dependencies
        id: install
        continue-on-error: true
        run: npm --prefix functions install --ignore-scripts

      - name: Configure Firebase credentials
        id: firebase-auth
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
            chmod 600 "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
            echo "auth=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN_VALUE" ]; then
            echo "auth=token" >> "$GITHUB_OUTPUT"
          else
            echo "auth=missing" >> "$GITHUB_OUTPUT"
            echo "Firebase 배포 인증 Secret이 없습니다." >&2
          fi

      - name: Remove legacy dailyVerses data
        id: remove-daily-verses
        if: steps.install.outcome == 'success' && steps.firebase-auth.outputs.auth != 'missing'
        continue-on-error: true
        shell: bash
        run: |
          AUTH_ARGS=()
          if [ "${{ steps.firebase-auth.outputs.auth }}" = "token" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_VALUE")
          fi
          npx --yes firebase-tools database:remove /dailyVerses \
            --project church-399cb \
            --force \
            "${AUTH_ARGS[@]}"

      - name: Deploy Functions, Database, Storage and Hosting
        id: firebase-deploy
        if: steps.install.outcome == 'success' && steps.firebase-auth.outputs.auth != 'missing' && steps.remove-daily-verses.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          AUTH_ARGS=()
          if [ "${{ steps.firebase-auth.outputs.auth }}" = "token" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_VALUE")
          fi
          npx --yes firebase-tools deploy \
            --project church-399cb \
            --only functions,database,storage,hosting \
            --non-interactive \
            "${AUTH_ARGS[@]}"

      - name: Publish deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_MODE: ${{ steps.firebase-auth.outputs.auth }}
          CLEANUP_OUTCOME: ${{ steps.remove-daily-verses.outcome }}
          DEPLOY_OUTCOME: ${{ steps.firebase-deploy.outcome }}
        with:
          script: |
            const success = process.env.INSTALL_OUTCOME === 'success'
              && process.env.AUTH_MODE !== 'missing'
              && process.env.CLEANUP_OUTCOME === 'success'
              && process.env.DEPLOY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'firebase/deploy',
              description: success
                ? 'Firebase production deployment completed'
                : 'Firebase deployment failed; open the Actions log',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow when deployment failed
        if: always() && (steps.install.outcome != 'success' || steps.firebase-auth.outputs.auth == 'missing' || steps.remove-daily-verses.outcome != 'success' || steps.firebase-deploy.outcome != 'success')
        run: exit 1
