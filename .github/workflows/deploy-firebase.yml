name: Deploy Firebase production

on:
  push:
    branches:
      - "claude/church-website-app-HNkR5"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHURCH_399CB }}
      FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'firebase/deploy',
              description: 'Firebase production deployment is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Bible data migration
        run: node scripts/remove-legacy-daily-verses.mjs

      - name: Detect Functions changes
        id: functions_changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- functions; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Functions dependencies
        if: steps.functions_changed.outputs.changed == 'true'
        run: npm --prefix functions install --ignore-scripts

      - name: Configure Firebase credentials
        id: firebase_auth
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
            chmod 600 "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
            echo "auth=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN_VALUE" ]; then
            echo "auth=token" >> "$GITHUB_OUTPUT"
          else
            echo "Firebase 배포 인증 Secret이 없습니다." >&2
            exit 1
          fi

      - name: Remove legacy dailyVerses data
        shell: bash
        run: |
          AUTH_ARGS=()
          if [ "${{ steps.firebase_auth.outputs.auth }}" = "token" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_VALUE")
          fi
          npx --yes firebase-tools database:remove /dailyVerses \
            --project church-399cb \
            --force \
            "${AUTH_ARGS[@]}"

      - name: Deploy Database, Storage and Hosting
        shell: bash
        run: |
          AUTH_ARGS=()
          if [ "${{ steps.firebase_auth.outputs.auth }}" = "token" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_VALUE")
          fi
          npx --yes firebase-tools deploy \
            --project church-399cb \
            --only database,storage,hosting \
            --non-interactive \
            "${AUTH_ARGS[@]}"

      - name: Deploy Functions when changed
        if: steps.functions_changed.outputs.changed == 'true'
        shell: bash
        run: |
          AUTH_ARGS=()
          if [ "${{ steps.firebase_auth.outputs.auth }}" = "token" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_VALUE")
          fi
          npx --yes firebase-tools deploy \
            --project church-399cb \
            --only functions \
            --non-interactive \
            "${AUTH_ARGS[@]}"

      - name: Publish deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'firebase/deploy',
              description: 'Firebase production deployment completed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'firebase/deploy',
              description: 'Firebase deployment failed; open the Actions log',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
