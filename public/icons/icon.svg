<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8c19b"/>
      <stop offset="60%" stop-color="#7fa276"/>
      <stop offset="100%" stop-color="#5d7858"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3a5530" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 라운드 사각 배경 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 부드러운 광택 -->
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- 십자가 (둥근 모서리) -->
  <g filter="url(#shadow)">
    <rect x="231" y="100" width="50" height="312" rx="20" fill="#ffffff"/>
    <rect x="151" y="190" width="210" height="50" rx="20" fill="#ffffff"/>
  </g>

  <!-- 작은 점 (세련된 디테일) -->
  <circle cx="256" cy="370" r="10" fill="#ffffff" opacity="0.85"/>
</svg>
