<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#73926d">
  <title>오프라인 · 천안남산교회</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f4;color:#15171a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.card{width:min(100%,420px);padding:30px 26px;border:1px solid #e5e7e1;border-radius:20px;background:#fff;text-align:center;box-shadow:0 12px 32px rgba(20,22,26,.07)}h1{font-size:21px;margin:0 0 10px}p{margin:0;color:#6d727b;line-height:1.65;font-size:14px}button{margin-top:22px;border:0;border-radius:10px;background:#73926d;color:#fff;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <h1>인터넷 연결을 확인해주세요</h1>
    <p>현재 교회 소식을 불러올 수 없습니다.<br>연결이 복구되면 다시 시도해주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
